sonar.organization=diandria
sonar.projectKey=diandria_fiap-tech-challenge-payment
sonar.projectName=Payment Service

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Reuses the lcov from `npm run test:coverage` instead of recomputing.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Without these, Sonar analyses `dist/` and reports every issue twice.
sonar.exclusions=dist/**,coverage/**,node_modules/**

# The file jest leaves out of coverage on purpose (the process entry point).
# Without the same list here, any pull request touching it would fail the
# gate's coverage on new code.
sonar.coverage.exclusions=src/main.ts

# The scanner waits for the quality gate and fails when it fails.
sonar.qualitygate.wait=true
